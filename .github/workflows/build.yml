# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: game test summary
        if: always()
        run: |
          # Muestra como anotaciones del workflow el resultado de las pruebas dentro del juego.
          LOG=$(find build -path "*gameTest*" -name "latest.log" | head -1)
          if [ -z "$LOG" ]; then echo "::warning::No se encontró el registro de las pruebas en el juego"; exit 0; fi
          grep -iE "tests? (passed|failed)|required tests|optional tests|failed|GameTest" "$LOG" | tail -20 | sed 's/^/::notice::/' || true
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
